const A = "https://api.sleeper.app/v1/league/" + LEAGUE;
const OPEN = { team: null, week: null };
let VIEW = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sg = x => (x > 0 ? "+" : "") + (Math.round(x * 100) / 100);
const f1 = x => (Math.round(x * 100) / 100).toFixed(2);
function pName(id) {
  const p = PLAYERS[id];
  if (p) return { n: p[0], s: [p[1], p[2]].filter(Boolean).join(" · ") };
  if (/^[A-Z]{2,3}$/.test(id)) return { n: id + " Defense", s: "DEF" };
  return { n: id === "0" ? "Empty" : id, s: "" };
}
async function load() {
  try {
    const [rs, us, lg, state] = await Promise.all([A + "/rosters", A + "/users", A, "https://api.sleeper.app/v1/state/nfl"].map(u => fetch(u, { cache: "no-store" }).then(r => r.json())));
    const last = Math.max(1, (state.week || 1) - 1);
    const weeks = await Promise.all(Array.from({ length: last }, (_, i) => fetch(A + "/matchups/" + (i + 1), { cache: "no-store" }).then(r => r.json())));
    const name = Object.fromEntries(us.map(u => [u.user_id, u.display_name]));
    const rid = Object.fromEntries(rs.map(r => [r.roster_id, name[r.owner_id] || ("Team " + r.roster_id)]));
    const bonusOf = (n, w) => { const d = BONUS.find(b => b.week === w && b.team === n); return d ? d.items.reduce((a, i) => a + i.pts, 0) : 0; };
    // Every team, every finished week: base score (players only, no bonuses) + all event bonuses = total.
    // Results and PF come from these totals, whether or not a bonus was ever entered in Sleeper.
    const log = {};
    weeks.forEach((ms, i) => {
      const w = i + 1, by = {};
      (ms || []).forEach(m => {
        const n = rid[m.roster_id], base = m.points || 0, bonus = bonusOf(n, w);
        (by[m.matchup_id] = by[m.matchup_id] || []).push({ n, m, w, base, bonus, score: base + bonus });
      });
      Object.values(by).forEach(pr => pr.forEach(x => {
        const o = pr.find(y => y !== x);
        x.opp = o ? o.n : null; x.oppScore = o ? o.score : null;
        x.res = !o ? "-" : Math.abs(x.score - o.score) < 0.005 ? "T" : x.score > o.score ? "W" : "L";
        (log[x.n] = log[x.n] || []).push(x);
      }));
    });
    const teams = rs.map(r => {
      const n = rid[r.roster_id], a = log[n] || [];
      const ai = LEDGER.entries.filter(e => e.team === n && (e.ai === "W" || e.ai === "L"));
      const w = a.filter(x => x.res === "W").length + ai.filter(e => e.ai === "W").length;
      const l = a.filter(x => x.res === "L").length + ai.filter(e => e.ai === "L").length;
      return { n, w, l, st: a.filter(x => x.res === "T").length, pf: a.reduce((s, x) => s + x.score, 0) };
    });
    teams.sort((a, b) => (b.w - b.l) - (a.w - a.l) || b.pf - a.pf);
    const slots = ((lg.roster_positions) || []).filter(p => p !== "BN" && p !== "IR");
    VIEW = { teams, log, slots, cut: (lg.settings && lg.settings.playoff_teams) || 8 };
    render();
    document.getElementById("fresh").textContent = "Live from Sleeper · updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (e) { console.error(e); document.getElementById("fresh").textContent = "Couldn't reach Sleeper. Showing last load."; }
}
function weekBody(x) {
  const m = x.m, pp = m.players_points || {};
  const det = BONUS.find(b => b.week === x.w && b.team === x.n);
  const items = det ? det.items : [];
  const ai = LEDGER.entries.filter(e => e.team === x.n && e.week === x.w && (e.ai === "W" || e.ai === "L"));
  let h = `<div class="lbl">Score</div><div class="bn"><div>Base score<div class="h">Starting lineup, no bonuses</div></div><div class="p">${f1(x.base)}</div></div>`;
  items.forEach(b => h += `<div class="bn"><div>${esc(b.name)}<div class="h">${esc(b.how)}</div></div><div class="p">${sg(b.pts)}</div></div>`);
  if (!items.length) h += `<div class="bn"><div>No bonuses this week</div><div class="p">0</div></div>`;
  h += `<div class="bn tot"><div>Total</div><div class="p">${f1(x.score)}</div></div>`;
  if (x.opp) h += `<div class="bn"><div class="h">${x.res === "W" ? "Beat" : x.res === "L" ? "Lost to" : "Tied"} ${esc(x.opp)} ${f1(x.score)}–${f1(x.oppScore)}</div><div></div></div>`;
  ai.forEach(e => h += `<div class="bn"><div>Game vs the AI<div class="h">${esc(e.why)}</div></div><div class="p">${e.ai}</div></div>`);
  h += `<div class="lbl">Starting lineup</div>`;
  const st = m.starters || [], sp = m.starters_points || [];
  st.forEach((id, i) => {
    const p = pName(id), pts = sp[i] != null ? sp[i] : (pp[id] || 0);
    h += `<div class="ln"><div class="sl">${esc(VIEW.slots[i] || "")}</div><div>${esc(p.n)} <span class="tmn">${esc(p.s)}</span></div><div class="p">${f1(pts)}</div></div>`;
  });
  const bench = (m.players || []).filter(id => !st.includes(id)).sort((a, b) => (pp[b] || 0) - (pp[a] || 0));
  if (bench.length) {
    h += `<div class="lbl">Bench</div>`;
    bench.forEach(id => { const p = pName(id); h += `<div class="ln bench"><div class="sl">BN</div><div>${esc(p.n)} <span class="tmn">${esc(p.s)}</span></div><div class="p">${f1(pp[id] || 0)}</div></div>`; });
  }
  return `<div class="wkb">${h}</div>`;
}
function teamDetail(n) {
  const a = (VIEW.log[n] || []).slice().sort((p, q) => q.w - p.w);
  return `<div class="det">` + a.map(x => {
    const open = OPEN.week === x.w;
    const bc = Math.abs(x.bonus) < 0.001 ? "z" : x.bonus < 0 ? "neg" : "";
    return `<div class="wk"><div class="wkh" data-week="${x.w}"><div>Wk ${x.w}<span class="chev">${open ? "▾" : "▸"}</span></div>
      <div class="res ${x.res}">${x.res}</div>
      <div style="min-width:0"><div class="opp">${f1(x.score)}–${x.oppScore != null ? f1(x.oppScore) : "-"} vs ${esc(x.opp || "-")}</div>${LEDGER.entries.filter(e => e.team === x.n && e.week === x.w && (e.ai === "W" || e.ai === "L")).map(e => `<div class="aiw">vs the AI: <b class="${e.ai}">${e.ai === "W" ? "Win" : "Loss"}</b></div>`).join("")}</div>
      <div class="b ${bc}">${Math.abs(x.bonus) < 0.001 ? "–" : sg(x.bonus)}</div></div>${open ? weekBody(x) : ""}</div>`;
  }).join("") + `</div>`;
}
function render() {
  if (!VIEW) return;
  let html = `<div class="row head"><div>#</div><div>Team</div><div style="text-align:center">Record</div><div style="text-align:right">PF</div></div>`;
  VIEW.teams.forEach((t, i) => {
    const open = OPEN.team === t.n;
    html += `<div class="row click${i === VIEW.cut - 1 && !open ? " cutline" : ""}" data-team="${esc(t.n)}"><div class="rk">${i + 1}</div>
      <div class="tm"><div class="n">${esc(t.n)}<span class="chev">${open ? "▾" : "▸"}</span></div></div>
      <div class="rec">${t.w}-${t.l}${t.st ? "-" + t.st : ""}</div><div class="pf">${t.pf.toFixed(1)}</div></div>`;
    if (open) html += teamDetail(t.n);
    if (i === VIEW.cut - 1) html += `<div class="cutlbl">Playoff line</div>`;
  });
  document.getElementById("table").innerHTML = html;
}
document.getElementById("table").addEventListener("click", ev => {
  const wk = ev.target.closest(".wkh");
  if (wk) { const w = +wk.dataset.week; OPEN.week = OPEN.week === w ? null : w; render(); return; }
  const row = ev.target.closest(".row.click");
  if (row) { const n = row.dataset.team; OPEN.team = OPEN.team === n ? null : n; OPEN.week = null; render(); }
});
load();
setInterval(() => { if (!document.hidden) load(); }, 300000);
</script>
